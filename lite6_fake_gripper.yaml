controller_manager:
  ros__parameters:
    lite6_fake_gripper_controller:
      type: position_controllers/GripperActionController

lite6_fake_gripper_controller:
  ros__parameters:
    joint: finger_joint1
    goal_tolerance: 0.0001
    allow_stalling: false
    stall_velocity_threshold: 0.0001
    stall_timeout: 2.0
    action_monitor_rate: 20.0